<text x="450" y="932" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" fill="#93A4BE" font-weight="400" text-anchor="start">scope: private LAN + authorized device</text>
<text x="1140" y="932" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B" font-weight="500" text-anchor="end">onn-tv-hack / 2026</text>
